name: 数仓ETL验证

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  etl-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ==================== 1. 启动集群 ====================
      - name: 启动集群
        run: |
          docker compose up -d
          echo "等待 Hadoop 就绪..."
          for i in $(seq 1 30); do
            if docker exec namenode hdfs dfs -ls / 2>/dev/null; then
              echo "✓ HDFS 就绪"
              break
            fi
            sleep 5
          done

          echo "等待 Hive Metastore 就绪..."
          for i in $(seq 1 30); do
            if docker exec hive-metastore bash -c "echo > /dev/tcp/localhost/9083" 2>/dev/null; then
              echo "✓ Hive Metastore 就绪"
              break
            fi
            sleep 5
          done

          echo "等待 HiveServer2 就绪..."
          for i in $(seq 1 60); do
            if docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -e "show databases;" 2>&1 | grep -q "database_name"; then
              echo "✓ HiveServer2 就绪 (尝试 $i 次)"
              break
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "  等待中... ($i/60)"
            fi
            sleep 5
          done

          # 最终确认
          docker compose ps
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -e "show databases;" 2>&1

      # ==================== 2. 生成数据 ====================
      - name: 生成模拟数据
        run: |
          mkdir -p data logs
          python3 scripts/generate_mock_data.py
          ls -lh data/

      # ==================== 3. ODS 层 ====================
      - name: "ETL: ODS 贴源层"
        run: |
          DT="2026-07-26"

          echo "=== ODS 建表 ==="
          for f in sql/ods/ods_category.sql sql/ods/ods_user.sql sql/ods/ods_product.sql sql/ods/ods_order.sql; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -f "/opt/$f" 2>&1 | grep -v "SLF4J\|Connecting\|Connected"
          done

          echo ""
          echo "=== 去表头 + 加载数据 ==="
          docker exec hive-server bash -c "
            for f in /opt/data/biz_*.csv; do
              base=\$(basename \$f .csv)
              tail -n +2 \$f > /opt/data/\${base}_nohead.csv
              echo \"去表头: \${base}_nohead.csv (\$(wc -l < /opt/data/\${base}_nohead.csv) 行)\"
            done
          "

          for tbl in category user product order; do
            echo "加载 ods_$tbl..."
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -e "LOAD DATA LOCAL INPATH '/opt/data/biz_${tbl}_nohead.csv' INTO TABLE ods.ods_${tbl} PARTITION (dt='${DT}')" 2>&1 | grep -v "SLF4J\|Connecting\|Connected"
          done

          echo ""
          echo "=== ODS 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'ods_category', COUNT(*) FROM ods.ods_category
                UNION ALL SELECT 'ods_user', COUNT(*) FROM ods.ods_user
                UNION ALL SELECT 'ods_product', COUNT(*) FROM ods.ods_product
                UNION ALL SELECT 'ods_order', COUNT(*) FROM ods.ods_order;" 2>&1 | grep -v "SLF4J"

          echo "✓ ODS 层完成"

      # ==================== 4. DWD 维度 ====================
      - name: "ETL: DWD 明细层 — 维度表"
        run: |
          DT="2026-07-26"

          echo "=== DWD 维度 DDL ==="
          for f in sql/dwd/dwd_dim_category.sql sql/dwd/dwd_dim_user.sql sql/dwd/dwd_dim_product.sql; do
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -f "/opt/$f" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== DWD 维度 ETL ==="
          for f in etl_dim_category etl_dim_user etl_dim_product; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              --hivevar dt="${DT}" -f "/opt/sql/dwd/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "✓ DWD 维度完成"

      # ==================== 5. DWD 事实 ====================
      - name: "ETL: DWD 明细层 — 事实表"
        run: |
          DT="2026-07-26"

          echo "=== DWD 事实 DDL ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -f /opt/sql/dwd/dwd_fact_order.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected"

          echo "=== DWD 事实 ETL ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/dwd/etl_fact_order.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo ""
          echo "=== DWD 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'dwd_dim_user', COUNT(*) FROM dwd.dwd_dim_user
                UNION ALL SELECT 'dwd_dim_product', COUNT(*) FROM dwd.dwd_dim_product
                UNION ALL SELECT 'dwd_dim_category', COUNT(*) FROM dwd.dwd_dim_category
                UNION ALL SELECT 'dwd_fact_order', COUNT(*) FROM dwd.dwd_fact_order;" 2>&1 | grep -v "SLF4J"

          echo "✓ DWD 事实完成"

      # ==================== 6. DWS 层 ====================
      - name: "ETL: DWS 汇总层"
        run: |
          DT="2026-07-26"

          for f in sql/dws/dws_user_daily_summary.sql sql/dws/dws_product_daily_sales.sql; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              --hivevar dt="${DT}" -f "/opt/$f" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo ""
          echo "=== DWS 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'dws_user_daily', COUNT(*) FROM dws.dws_user_daily_summary
                UNION ALL SELECT 'dws_product_daily', COUNT(*) FROM dws.dws_product_daily_sales;" 2>&1 | grep -v "SLF4J"

          echo "✓ DWS 层完成"

      # ==================== 7. ADS 层 ====================
      - name: "ETL: ADS 应用层 KPI"
        run: |
          DT="2026-07-26"

          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/ads/ads_daily_kpi.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo ""
          echo "=== ADS KPI 结果 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT * FROM ads.ads_daily_kpi;" 2>&1 | grep -v "SLF4J"

          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║  ✓ 全链路 ETL 验证通过!                      ║"
          echo "╚══════════════════════════════════════════════╝"

      # ==================== 8. 导出 ====================
      - name: 导出日志
        if: always()
        run: |
          docker compose logs --tail=200 > logs/docker-compose.log 2>/dev/null || true
          docker logs hive-server --tail=100 > logs/hive-server.log 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: logs/
          retention-days: 7

      - name: 清理
        if: always()
        run: docker compose down -v
