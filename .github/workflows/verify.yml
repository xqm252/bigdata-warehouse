name: 数仓ETL验证

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  etl-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启动集群
        run: |
          echo "=== 拉取镜像并启动 ==="
          docker compose up -d 2>&1
          echo ""
          echo "=== 等待 30s 让容器初始化 ==="
          sleep 30
          echo ""
          echo "=== 容器状态 ==="
          docker compose ps -a
          echo ""
          # 诊断：打印所有容器的日志
          echo "=== namenode 日志(最近10行) ==="
          docker logs namenode --tail=10 2>&1 || echo "(无)"
          echo "=== datanode 日志(最近10行) ==="
          docker logs datanode --tail=10 2>&1 || echo "(无)"
          echo "=== hive-metastore-postgresql 日志(最近10行) ==="
          docker logs hive-metastore-postgresql --tail=10 2>&1 || echo "(无)"
          echo "=== hive-metastore 日志(最近10行) ==="
          docker logs hive-metastore --tail=10 2>&1 || echo "(无)"
          echo "=== hive-server 日志(最近20行) ==="
          docker logs hive-server --tail=20 2>&1 || echo "(无)"

          # 如果 hive-server 不存在，尝试单独启动
          if ! docker ps --format '{{.Names}}' | grep -q "hive-server"; then
            echo ""
            echo "!!! hive-server 未运行，尝试重新启动..."
            docker compose up -d hive-metastore-postgresql 2>&1
            sleep 10
            docker compose up -d hive-metastore 2>&1
            sleep 10
            docker compose up -d hive-server 2>&1
            sleep 20
            docker compose ps -a
          fi

      - name: 等待 HiveServer2 就绪
        run: |
          echo "等待 HiveServer2 接受连接..."
          for i in $(seq 1 60); do
            # 先确认容器在运行
            if ! docker ps --format '{{.Names}}' | grep -q "hive-server"; then
              echo "✗ hive-server 容器不存在!"
              docker compose ps -a
              exit 1
            fi
            if docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -e "show databases;" 2>&1 | grep -q "database_name"; then
              echo "✓ HiveServer2 就绪 (尝试 $i 次)"
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "  等待中... ($i/60)"
            fi
            sleep 5
          done
          echo "✗ HiveServer2 超时未就绪"
          echo "=== hive-server 完整日志 ==="
          docker logs hive-server 2>&1 || true
          exit 1

      - name: 生成模拟数据
        run: |
          mkdir -p data logs
          python3 scripts/generate_mock_data.py
          ls -lh data/

      - name: "ETL: ODS 贴源层"
        run: |
          DT="2026-07-26"
          echo "=== ODS 建表 ==="
          for f in sql/ods/ods_category.sql sql/ods/ods_user.sql sql/ods/ods_product.sql sql/ods/ods_order.sql; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -f "/opt/$f" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== 去表头 ==="
          docker exec hive-server bash -c "
            for f in /opt/data/biz_*.csv; do
              base=\$(basename \$f .csv)
              tail -n +2 \$f > /opt/data/\${base}_nohead.csv
              echo \"  \${base}_nohead.csv: \$(wc -l < /opt/data/\${base}_nohead.csv) 行\"
            done
          "

          echo "=== LOAD DATA ==="
          for tbl in category user product order; do
            echo "加载 ods_$tbl..."
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -e "LOAD DATA LOCAL INPATH '/opt/data/biz_${tbl}_nohead.csv' INTO TABLE ods.ods_${tbl} PARTITION (dt='${DT}')" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'ods_category', COUNT(*) FROM ods.ods_category
                UNION ALL SELECT 'ods_user', COUNT(*) FROM ods.ods_user
                UNION ALL SELECT 'ods_product', COUNT(*) FROM ods.ods_product
                UNION ALL SELECT 'ods_order', COUNT(*) FROM ods.ods_order;" 2>&1 | grep -v "SLF4J"
          echo "✓ ODS 完成"

      - name: "ETL: DWD 明细层"
        run: |
          DT="2026-07-26"
          echo "=== DWD DDL ==="
          for f in dwd_dim_category dwd_dim_user dwd_dim_product dwd_fact_order; do
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -f "/opt/sql/dwd/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== DWD ETL ==="
          for f in etl_dim_category etl_dim_user etl_dim_product etl_fact_order; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              --hivevar dt="${DT}" -f "/opt/sql/dwd/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded\|SLF4J"
          done

          echo "=== 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'dwd_dim_user', COUNT(*) FROM dwd.dwd_dim_user
                UNION ALL SELECT 'dwd_dim_product', COUNT(*) FROM dwd.dwd_dim_product
                UNION ALL SELECT 'dwd_dim_category', COUNT(*) FROM dwd.dwd_dim_category
                UNION ALL SELECT 'dwd_fact_order', COUNT(*) FROM dwd.dwd_fact_order;" 2>&1 | grep -v "SLF4J"
          echo "✓ DWD 完成"

      - name: "ETL: DWS + ADS"
        run: |
          DT="2026-07-26"
          echo "=== DWS 汇总 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/dws/dws_user_daily_summary.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/dws/dws_product_daily_sales.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo "=== ADS KPI ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/ads/ads_daily_kpi.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo ""
          echo "=== 最终 KPI ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT * FROM ads.ads_daily_kpi;" 2>&1 | grep -v "SLF4J"
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✓ 全链路 ETL 验证通过!                 ║"
          echo "╚══════════════════════════════════════════╝"

      - name: 导出日志
        if: always()
        run: |
          docker compose logs --tail=200 > logs/docker-compose.log 2>/dev/null || true
          docker logs hive-server --tail=100 > logs/hive-server.log 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: logs/
          retention-days: 7

      - name: 清理
        if: always()
        run: docker compose down -v
