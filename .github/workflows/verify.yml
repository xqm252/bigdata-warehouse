name: 数仓ETL验证

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  etl-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ==================== 逐个启动，避免竞态 ====================
      - name: 启动集群（逐个启动）
        run: |
          echo "=== 1/5 启动 namenode ==="
          docker compose up -d namenode
          for i in $(seq 1 30); do
            if docker exec namenode hdfs dfsadmin -safemode get 2>&1 | grep -q "Safe mode is OFF"; then
              echo "✓ namenode 就绪 (safe mode OFF)"
              break
            fi
            echo "  等待 namenode 退出安全模式... ($i/30)"
            sleep 5
          done

          echo "=== 2/5 启动 datanode ==="
          docker compose up -d datanode
          sleep 15
          # 验证 datanode 注册成功
          docker exec namenode hdfs dfsadmin -report 2>&1 | grep -E "Live datanodes|Datanodes available" || echo "  (等待 datanode 注册...)"

          echo "=== 3/5 启动 PostgreSQL ==="
          docker compose up -d hive-metastore-postgresql
          for i in $(seq 1 20); do
            if docker exec hive-metastore-postgresql pg_isready -U hive 2>&1 | grep -q "accepting"; then
              echo "✓ PostgreSQL 就绪"
              break
            fi
            sleep 3
          done

          echo "=== 4/5 启动 Hive Metastore ==="
          docker compose up -d hive-metastore
          for i in $(seq 1 30); do
            if docker logs hive-metastore 2>&1 | grep -q "Starting hive metastore"; then
              echo "✓ Hive Metastore 已启动"
              break
            fi
            sleep 5
          done

          echo "=== 5/5 启动 HiveServer2 ==="
          docker compose up -d hive-server
          echo "等待 HiveServer2 接受 JDBC 连接..."
          for i in $(seq 1 60); do
            if docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -e "show databases;" 2>&1 | grep -q "database_name"; then
              echo "✓ HiveServer2 就绪! (尝试 $i 次)"
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "  等待中... ($i/60)"
              # 每10次看看 hive-metastore 还在不在
              docker logs hive-metastore --tail=3 2>&1 || true
            fi
            sleep 5
          done

          echo ""
          echo "=== 最终状态 ==="
          docker compose ps -a
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 -e "show databases;" 2>&1 | grep -v "SLF4J"

      # ==================== 生成数据 ====================
      - name: 生成模拟数据
        run: |
          mkdir -p data logs
          python3 scripts/generate_mock_data.py
          ls -lh data/

      # ==================== ODS ====================
      - name: "ETL: ODS 贴源层"
        run: |
          DT="2026-07-26"
          echo "=== ODS 建表 ==="
          for f in ods_category ods_user ods_product ods_order; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -f "/opt/sql/ods/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== 去表头 ==="
          docker exec hive-server bash -c "
            for f in /opt/data/biz_*.csv; do
              base=\$(basename \$f .csv)
              tail -n +2 \$f > /opt/data/\${base}_nohead.csv
              echo \"  \${base}_nohead.csv: \$(wc -l < /opt/data/\${base}_nohead.csv) 行\"
            done
          "

          echo "=== LOAD DATA ==="
          for tbl in category user product order; do
            echo "加载 ods_$tbl..."
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -e "LOAD DATA LOCAL INPATH '/opt/data/biz_${tbl}_nohead.csv' INTO TABLE ods.ods_${tbl} PARTITION (dt='${DT}')" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'ods_category', COUNT(*) FROM ods.ods_category
                UNION ALL SELECT 'ods_user', COUNT(*) FROM ods.ods_user
                UNION ALL SELECT 'ods_product', COUNT(*) FROM ods.ods_product
                UNION ALL SELECT 'ods_order', COUNT(*) FROM ods.ods_order;" 2>&1 | grep -v "SLF4J"
          echo "✓ ODS 完成"

      # ==================== DWD ====================
      - name: "ETL: DWD 明细层"
        run: |
          DT="2026-07-26"
          echo "=== DWD DDL ==="
          for f in dwd_dim_category dwd_dim_user dwd_dim_product dwd_fact_order; do
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              -f "/opt/sql/dwd/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== DWD ETL ==="
          for f in etl_dim_category etl_dim_user etl_dim_product etl_fact_order; do
            echo "执行: $f"
            docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
              --hivevar dt="${DT}" -f "/opt/sql/dwd/${f}.sql" 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          done

          echo "=== 验证 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT 'dwd_dim_user', COUNT(*) FROM dwd.dwd_dim_user
                UNION ALL SELECT 'dwd_dim_product', COUNT(*) FROM dwd.dwd_dim_product
                UNION ALL SELECT 'dwd_dim_category', COUNT(*) FROM dwd.dwd_dim_category
                UNION ALL SELECT 'dwd_fact_order', COUNT(*) FROM dwd.dwd_fact_order;" 2>&1 | grep -v "SLF4J"
          echo "✓ DWD 完成"

      # ==================== DWS + ADS ====================
      - name: "ETL: DWS + ADS 应用层"
        run: |
          DT="2026-07-26"
          echo "=== DWS 汇总 ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/dws/dws_user_daily_summary.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/dws/dws_product_daily_sales.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo ""
          echo "=== ADS KPI ==="
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 \
            --hivevar dt="${DT}" -f /opt/sql/ads/ads_daily_kpi.sql 2>&1 | grep -v "SLF4J\|Connecting\|Connected\|Loaded"

          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║        最终 KPI 结果                      ║"
          echo "╚══════════════════════════════════════════╝"
          docker exec hive-server beeline -u jdbc:hive2://localhost:10000 --outputformat=csv2 \
            -e "SELECT * FROM ads.ads_daily_kpi;" 2>&1 | grep -v "SLF4J"
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  ✓ 全链路 ETL 验证通过!                 ║"
          echo "╚══════════════════════════════════════════╝"

      - name: 导出日志
        if: always()
        run: |
          docker compose logs --tail=200 > logs/docker-compose.log 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: logs/
          retention-days: 7

      - name: 清理
        if: always()
        run: docker compose down -v
